server {
    listen 80;
    listen [::]:80;
    server_name i.juan.is;

    root /srv/pickr/files;
    access_log /var/log/nginx/i.juan.is.access.log;
    error_log  /var/log/nginx/i.juan.is.error.log;
    client_max_body_size 1g;

    # The authenticated API: never cached, rate limited, streamed through.
    location /api/ {
        limit_req zone=pickr_api burst=20 nodelay;
        proxy_pass http://pickr_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # 2013 pickr.me shapes still out in the wild.
    location ~ ^/(?:i|f)/(.+)$ {
        return 301 /$1$is_args$args;
    }
    location ~ ^/t/(.+)_(\d+)\.([A-Za-z0-9]+)$ {
        return 301 /$1.$3?w=$2;
    }

    # Rendered variants: cache first, Node on a miss. Reached only by the rewrite below.
    location /_render/ {
        internal;
        limit_req zone=pickr_render burst=30 nodelay;
        proxy_pass http://pickr_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache pickr;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_read_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Originals straight off the disk. Anything with a query string goes to the renderer.
    location / {
        if ($is_args) {
            rewrite ^(.*)$ /_render$1 last;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $pickr_csp;
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }
}
