# PURGE /_render/ID.ext*  from the service removes every cached variant of a file.
server {
    listen 127.0.0.1:8081;
    server_name pickr-purge;
    access_log off;

    location /_render/ {
        proxy_cache pickr;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_purge PURGE from 127.0.0.1;
        proxy_pass http://pickr_app;
    }
}
