# pickr: cache of rendered variants, API rate limit, helpers. The vhost is sites-available/i.juan.is.conf.
proxy_cache_path /var/cache/nginx/pickr levels=1:2 keys_zone=pickr:10m max_size=2g inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=pickr_api:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pickr_render:1m rate=10r/s;

upstream pickr_app {
    server 127.0.0.1:3100;
    keepalive 8;
}

# SVG can carry scripts: sandbox it when served as a file.
map $uri $pickr_csp {
    ~*\.svg$  "sandbox";
    default   "";
}
