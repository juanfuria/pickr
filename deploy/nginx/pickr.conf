# pickr: cache of rendered variants, API rate limit, helpers. The vhost is sites-available/i.juan.is.conf.
proxy_cache_path /var/cache/nginx/pickr levels=1:2 keys_zone=pickr:10m max_size=1g inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=pickr_api:1m rate=10r/s;

upstream pickr_app {
    server 127.0.0.1:3100;
    keepalive 8;
}

# Documents a browser would run (SVG, HTML, XML) are sandboxed when served as files.
map $uri $pickr_csp {
    ~*\.(?:svg|html?|xht(?:ml)?|xml|xsl)$  "sandbox";
    default   "";
}
